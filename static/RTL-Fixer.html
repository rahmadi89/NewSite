<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      padding: 2rem;
      background: #f8f0ff;
      font-family: sans-serif;
    }

    .center-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    label {
      text-align: center;
      display: block;
      width: 50%;
      margin-bottom: 0.5rem;
      border: 1px solid green;
      padding: 4px;
    }

    textarea {
      width: 50%;
      height: 150px;
      margin-bottom: 1rem;
      border: 2px solid green;
      font-family: inherit;
    }

    .output {
      background: #eee;
      padding: 1rem;
      border-radius: 8px;
      white-space: pre-wrap;
      margin-top: 1rem;
      width: 100%;
    }

    .button {
      padding: 0.5rem 1rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 50%;
      margin-bottom: 1rem;
    }

    .button:hover {
      background: #0056b3;
    }

    #result {
      width: 50%;
      margin-top: 1rem;
    }

    .message {
      margin-top: 0.5rem;
      color: green;
      font-weight: bold;
      display: none;
      animation: fadein 0.3s, fadeout 0.3s 2.5s;
    }

    @keyframes fadein {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes fadeout {
      from {opacity: 1;}
      to {opacity: 0;}
    }
  </style>
</head>

<body>

  <div class="center-wrapper">
    <label for="input_text">‫متن خود را وارد کنید:‬</label>
    <textarea id="input_text"></textarea>

    <button class="button" onclick="fixText()">اصلاح</button>
    <button class="button" style="background:#dc3545;" onclick="clearText()">پاک کردن</button>

    <div id="result" class="center-wrapper">
      <label>نتیجه:</label>
      <textarea id="fixedTextOutput" class="output" readonly></textarea>
      <button class="button" onclick="copyFixedText()">کپی</button>
      <div id="copyMessage" class="message">✅ متن با موفقیت کپی شد</div>
    </div>
  </div>

  <script>
    function fixText() {
      const input = document.getElementById('input_text').value;
      const RLE = '\u202B';
      const PDF = '\u202C';

      const cleaned = input.replace(/[\u202A-\u202E]/g, '');
      const fixed = RLE + cleaned + PDF;

      document.getElementById('fixedTextOutput').value = fixed;
    }

    function clearText() {
      document.getElementById('input_text').value = '';
      document.getElementById('fixedTextOutput').value = '';
      document.getElementById('copyMessage').style.display = 'none';
    }

    function copyFixedText() {
      const output = document.getElementById('fixedTextOutput');
      const msg = document.getElementById('copyMessage');

      output.select();
      output.setSelectionRange(0, 99999);

      navigator.clipboard.writeText(output.value).then(() => {
        msg.textContent = '✅ متن با موفقیت کپی شد';
        msg.style.color = 'green';
        msg.style.display = 'block';
        setTimeout(() => {
          msg.style.display = 'none';
        }, 3000);
      }).catch(() => {
        msg.textContent = '❌ خطا در کپی کردن متن';
        msg.style.color = 'red';
        msg.style.display = 'block';
        setTimeout(() => {
          msg.style.display = 'none';
          msg.style.color = 'green';
          msg.textContent = '✅ متن با موفقیت کپی شد';
        }, 3000);
      });
    }
  </script>

</body>
</html>
